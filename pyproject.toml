[project]
name = "audio2text"
version = "0.1.0"
description = "Real-time audio transcription prototype with FastAPI, WebSocket and Qwen3-ASR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "openai>=2.0.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "requests>=2.34.2",
    "numpy==1.26.4",
    "soxr>=1,<2",
    "tokenizers>=0.21,<1",
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "scipy==1.14.1",
    "scikit-learn==1.6.1",
    "pyannote.audio==3.4.0",
    "funasr==1.3.1",
    "PyYAML==6.0.3",
    "scipy-stubs~=1.14.1",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cpu/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6,<4",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["checks"]
asyncio_mode = "auto"
pythonpath = ["."]
