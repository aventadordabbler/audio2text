services:
  app:
    build: .
    environment:
      ASR_MODE: ${ASR_MODE:-mock}
      VLLM_BASE_URL: http://vllm:8001/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-ASR-1.7B}
      DATA_DIR: /app/data/archives
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      vllm:
        condition: service_healthy
        required: false
  vllm:
    image: vllm/vllm-openai:v0.14.0
    profiles: [gpu]
    command: ["--model", "${VLLM_MODEL:-Qwen/Qwen3-ASR-1.7B}", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models')"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  hf-cache:
