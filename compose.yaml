services:
  app:
    build: .
    profiles: [app]
    container_name: audio2text-server
    environment:
      DATA_DIR: /app/data/archives
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      vllm:
        condition: service_healthy
        required: false
  vllm:
    image: qwenllm/qwen3-asr:latest
    container_name: audio2text-vllm
    profiles: [gpu]
    command:
      - qwen-asr-serve
      - ${VLLM_MODEL_PATH:-/models/qwen3-asr-1.7b}
      - --served-model-name
      - ${VLLM_MODEL:-qwen3-asr-1.7b}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.8}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models')"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  hf-cache:
