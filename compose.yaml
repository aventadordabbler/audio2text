services:
  app:
    image: quantitative.io/library/audio2text:latest
    profiles: [app]
    container_name: audio2text-server
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data/archives
      ASR_TOKENIZER: ${ASR_TOKENIZER:-/app/data/tokenizers/qwen}
      ASR_SEND_CHAT_TEMPLATE: ${ASR_SEND_CHAT_TEMPLATE:-false}
      ASR_WINDOW_SECONDS: ${ASR_WINDOW_SECONDS:-5}
      ASR_STRIDE_SECONDS: ${ASR_STRIDE_SECONDS:-2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16384}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-12000}
      STAGE_SUMMARY_WINDOW_SECONDS: ${STAGE_SUMMARY_WINDOW_SECONDS:-60}
      STAGE_SUMMARY_MAX_TOKENS: ${STAGE_SUMMARY_MAX_TOKENS:-1024}
      DIARIZATION_MODEL_DIR: /app/models/diarization
      DIARIZATION_SEGMENTATION_DIR: /app/models/pyannote/segmentation-3.0
      DIARIZATION_WORKERS: ${DIARIZATION_WORKERS:-1}
      DIARIZATION_THREADS: ${DIARIZATION_THREADS:-2}
      DIARIZATION_TIMEOUT_SECONDS: ${DIARIZATION_TIMEOUT_SECONDS:-120}
      DIARIZATION_FINAL_TIMEOUT_SECONDS: ${DIARIZATION_FINAL_TIMEOUT_SECONDS:-1800}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ${DIARIZATION_MODEL_DIR:-./models/diarization}:/app/models/diarization:ro
      - ${DIARIZATION_SEGMENTATION_DIR:-./models/pyannote/segmentation-3.0}:/app/models/pyannote/segmentation-3.0:ro
  asr:
    image: ${VLLM_IMAGE:-qwenllm/qwen3-asr:latest}
    container_name: audio2text-asr
    profiles: [gpu]
    restart: unless-stopped
    command:
      - qwen-asr-serve
      - ${VLLM_MODEL_PATH:-/models/qwen3-asr-1.7b}
      - --served-model-name
      - ${VLLM_MODEL:-qwen3-asr-1.7b}
      - --trust-request-chat-template
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.3}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
    ports:
      - "${VLLM_BIND_ADDRESS:-127.0.0.1}:${VLLM_PORT:-8001}:8001"
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models')"]
      interval: 10s
      timeout: 5s
      retries: 30
  llm:
    image: ${LLM_VLLM_IMAGE:-registry.neuro.com/vllm/vllm-openai:v0.30.0-aarch64-cu129}
    container_name: audio2text-llm
    profiles: [gpu]
    restart: unless-stopped
    command:
      - --model
      - ${LLM_VLLM_MODEL_PATH:-/models/llm}
      - --served-model-name
      - ${LLM_VLLM_MODEL:-local-llm}
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --gpu-memory-utilization
      - ${LLM_VLLM_GPU_MEMORY_UTILIZATION:-0.6}
      - --max-model-len
      - ${LLM_VLLM_MAX_MODEL_LEN:-32768}
    ports:
      - "${LLM_VLLM_BIND_ADDRESS:-0.0.0.0}:${LLM_VLLM_PORT:-8002}:8002"
    volumes:
      - type: bind
        source: ${LLM_VLLM_MODEL_DIR:-./models/llm}
        target: ${LLM_VLLM_MODEL_PATH:-/models/llm}
        read_only: true
      - llm-vllm-cache:/root/.cache/vllm
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/v1/models')"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  hf-cache:
  llm-vllm-cache:
